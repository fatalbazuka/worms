# Развёртывание на своём сервере.
#
#   cp .env.example .env      # вписать домен и, если нужно, ключи
#   docker compose up -d --build                  # только игра на порту HTTP_PORT
#   docker compose --profile https up -d --build  # + Caddy с HTTPS от Let's Encrypt
#
# Подробно — DEPLOY.md.
services:
  # Игра: nginx раздаёт статику и проксирует /api в контейнер api
  web:
    build: .
    image: worms:latest
    restart: unless-stopped
    depends_on: [api]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_LEGACY_KEY: ${SUPABASE_LEGACY_KEY:-}
      TELEGRAM_BOT: ${TELEGRAM_BOT:-}
      TELEGRAM_APP: ${TELEGRAM_APP:-}
      WORMS_UI: ${WORMS_UI:-}
      WORMS_API: ${WORMS_API:-}
      # 1 — в обычном браузере вместо игры ссылка на бота
      TELEGRAM_ONLY: ${TELEGRAM_ONLY:-1}
    # Порт наружу. С профилем https лучше оставить 127.0.0.1:8080:80 —
    # тогда игра доступна только через Caddy.
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"

  # Аккаунты, рейтинг, турниры, бот и звёзды: Node + SQLite. База — в томе
  # worms_data, она переживает пересборку и обновления. Наружу порт не
  # открыт: только через nginx по /api (туда же Telegram шлёт вебхук).
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: worms-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      BOT_TZ: ${BOT_TZ:-Europe/Moscow}
    volumes:
      - worms_data:/data

  # Обратный прокси с автоматическим сертификатом. Нужен домен, который
  # смотрит на этот сервер, и открытые порты 80 и 443. Без HTTPS Telegram
  # Mini App не откроется, а браузер не даст полный экран и звук на части
  # устройств.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      WORMS_PATH: ${WORMS_PATH:-/worms}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Caddyfile — игра в корне домена, Caddyfile.subpath — по пути WORMS_PATH
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  worms_data:
  caddy_data:
  caddy_config:
