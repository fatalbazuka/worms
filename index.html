<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1021" />

<!-- «На экран Домой» запускает игру без адресной строки. На iPhone это
     единственный способ получить полный экран: Safari там не поддерживает
     Fullscreen API для произвольных элементов. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Worms" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Worms — пошаговая артиллерия</title>
<meta name="description" content="Пошаговая артиллерийская игра в браузере: быстрая игра, кампания с ботами и бой вдвоём по сети." />
<style>
  /* Шрифт интерфейса. Кириллица и латиница отдельными подмножествами:
     браузер тянет только нужное. Системный моноширинный, который был
     раньше, и делал интерфейс похожим на отладочный оверлей. */
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 700; font-display: block;
    src: url('./assets/font/nunito-700-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 700; font-display: block;
    src: url('./assets/font/nunito-700-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2122, U+2191-2193, U+2212, U+2215;
  }
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 800; font-display: block;
    src: url('./assets/font/nunito-800-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 800; font-display: block;
    src: url('./assets/font/nunito-800-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2122, U+2191-2193, U+2212, U+2215;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    /* 100% на iOS — это «большой» вьюпорт, тот, что без панели браузера:
       верх страницы уезжает под адресную строку. dvh — реально видимая
       высота прямо сейчас; 100% оставлен запасным для старых браузеров. */
    height: 100%;
    height: 100dvh;
    background: #0b1021;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Канвас на весь экран, включая «чёлку» и полосу под кнопками Telegram:
     мир рисуется до краёв, а интерфейс сам отступает внутрь (CFG.FRAME). */
  #game { position: fixed; inset: 0; }
  #game canvas { touch-action: none; }
  /* Диагностика экрана: включается пятью тапами по подписи внизу меню */
  #diag {
    position: fixed; left: 8px; top: 8px; z-index: 30; display: none;
    padding: 8px 10px; background: rgba(0,0,0,0.75); color: #9fe0a0;
    font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre;
    pointer-events: none; border-radius: 6px;
  }
  /* Щуп для безопасной области вне Telegram: JS читает env() через него */
  #safe-probe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #game canvas { display: block; }
  #gate {
    position: fixed; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #0b1021; color: #c3cee0; text-align: center; padding: 24px;
    font: 700 16px/1.5 'Worms UI', system-ui, sans-serif;
  }
  #gate .gate-title { font-size: 44px; font-weight: 800; color: #ffc247; letter-spacing: 2px; }
  #gate a {
    padding: 14px 26px; border-radius: 12px; background: linear-gradient(#3aa0e8, #1f6fb5);
    color: #fff; text-decoration: none; font-weight: 800;
  }
  #fatal {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #ffb4b4; background: #0b1021; text-align: center;
    padding: 24px; line-height: 1.5; font-size: 15px;
  }
  /* Бой ландшафтный: в портрете видна четверть карты, поэтому вместо него
     показываем просьбу повернуть устройство. */
  #rotate {
    position: fixed; inset: 0; display: none; z-index: 10;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0b1021; color: #c3cee0;
    text-align: center; padding: 24px; line-height: 1.5; font-size: 16px;
  }
  #rotate .phone {
    width: 54px; height: 92px; border: 3px solid #6ecbff; border-radius: 10px;
    animation: tilt 1.8s ease-in-out infinite;
  }
  @keyframes tilt {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  /* Меню и лобби работают в любой ориентации, повернуть просит только бой:
     класс in-battle ставит игровая сцена */
  @media (orientation: portrait) and (max-width: 900px) {
    body.in-battle #rotate { display: flex; }
  }
  /* На ПК подсказка про узкое окно, а не про поворот телефона */
  .desktop-only { display: none; }
  body.ui-desktop .desktop-only { display: block; }
  body.ui-desktop .touch-only, body.ui-desktop #rotate .phone { display: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="safe-probe"></div>
<div id="rotate">
  <div class="phone"></div>
  <div class="touch-only">Поверни телефон горизонтально</div>
  <div class="desktop-only">Окно слишком узкое — растяни его по ширине</div>
</div>
<div id="fatal"></div>
<!-- Вне Telegram (если сервер так настроен): игра только в боте -->
<div id="gate">
  <div class="gate-title">WORMS</div>
  <div>Игра живёт в Telegram: бои, кабинет, рейтинг и турниры — там.</div>
  <a href="#">Открыть в Telegram</a>
</div>
<div id="diag"></div>

<!-- Зум страницы. iOS игнорирует user-scalable=no, а щипок двумя пальцами
     в игре — это зум камеры; без этого он увеличивал саму страницу, и
     интерфейс уезжал за экран. Жест гасим сами, а если страница всё же
     увеличилась — сбрасываем масштаб перезаписью viewport. -->
<script>
  (function () {
    var stop = function (e) { e.preventDefault(); };
    document.addEventListener('gesturestart', stop, { passive: false });
    document.addEventListener('gesturechange', stop, { passive: false });
    document.addEventListener('gestureend', stop, { passive: false });
    document.addEventListener('touchmove', function (e) {
      if (e.scale !== undefined && e.scale !== 1) e.preventDefault();
    }, { passive: false });

    var vv = window.visualViewport;
    if (vv) {
      var meta = document.querySelector('meta[name="viewport"]');
      var resetting = false;
      vv.addEventListener('resize', function () {
        if (vv.scale <= 1.01 || resetting || !meta) return;
        resetting = true;
        var was = meta.content;
        meta.content = was.replace('maximum-scale=1', 'maximum-scale=1.0001');
        setTimeout(function () { meta.content = was; resetting = false; }, 60);
        window.scrollTo(0, 0);
      });
    }

    // Диагностика: что видит страница на самом деле
    var el = document.getElementById('diag');
    var timer = 0;
    function render() {
      var tg = window.Telegram && window.Telegram.WebApp;
      var c = document.querySelector('#game canvas');
      var r = c ? c.getBoundingClientRect() : null;
      var g = window.__WORMS__;
      var f = (x) => Math.round(x);
      var j = (o) => (o ? [f(o.top), f(o.right), f(o.bottom), f(o.left)].join('/') : '-');
      el.textContent = [
        'inner ' + innerWidth + 'x' + innerHeight + '  dpr ' + devicePixelRatio,
        'visual ' + (vv ? f(vv.width) + 'x' + f(vv.height) + ' scale ' + vv.scale.toFixed(3)
          + ' off ' + f(vv.offsetLeft) + ',' + f(vv.offsetTop) : '-'),
        'screen ' + screen.width + 'x' + screen.height + '  scroll ' + scrollX + ',' + scrollY,
        'tg ' + (tg ? 'v' + tg.version + ' vh ' + f(tg.viewportHeight) + ' stable ' + f(tg.viewportStableHeight)
          + ' full ' + tg.isFullscreen : 'нет'),
        'safe t/r/b/l ' + (tg ? j(tg.safeAreaInset) : '-') + '  content ' + (tg ? j(tg.contentSafeAreaInset) : '-'),
        'canvas ' + (r ? f(r.left) + ',' + f(r.top) + ' ' + f(r.width) + 'x' + f(r.height) : '-')
          + '  game ' + (g ? g.scale.width + 'x' + g.scale.height : '-'),
        'frame ' + (window.__WORMS_FRAME__ ? j(window.__WORMS_FRAME__) : '-'),
      ].join('\n');
    }
    window.__diag = function (on) {
      clearInterval(timer);
      el.style.display = on ? 'block' : 'none';
      if (on) { render(); timer = setInterval(render, 500); }
    };
  })();
</script>

<!-- Настройки развёртывания: адрес Supabase, имя бота. На своём сервере
     файл генерируется из переменных окружения (см. deploy/). -->
<script src="./env.js"></script>

<!-- Загрузка: Telegram SDK (только внутри Telegram) → Phaser → игра.
     Phaser берётся со своего же сервера, CDN — запасной путь. -->
<script>
  (function boot() {
    // Telegram всегда передаёт параметры запуска в адресе (#tgWebAppData…),
    // а после перезагрузки SDK хранит их в sessionStorage. В обычном
    // браузере SDK не нужен вовсе: он лишь сыплет ошибками в консоль.
    function insideTelegram() {
      if (window.Telegram && window.Telegram.WebApp) return false;   // уже есть (тест)
      if (/tgWebApp/.test(location.hash)) return true;
      if (window.TelegramWebviewProxy) return true;
      try { if (sessionStorage.getItem('__telegram__initParams')) return true; } catch (e) { /* — */ }
      return false;
    }

    var phaser = [
      './vendor/phaser.min.js',
      'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js',
      'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
    ];

    function load(src, ok, fail) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = fail;
      document.head.appendChild(s);
    }

    function loadPhaser(i) {
      if (window.Phaser) return start();
      if (i >= phaser.length) {
        var el = document.getElementById('fatal');
        el.style.display = 'flex';
        el.textContent = 'Не удалось загрузить Phaser 3. Проверьте сеть и обновите страницу.';
        return;
      }
      load(phaser[i], start, function () { loadPhaser(i + 1); });
    }

    function start() {
      var m = document.createElement('script');
      m.type = 'module';
      m.src = './src/main.js';
      document.body.appendChild(m);
    }

    // Без SDK игра всё равно запустится — как в обычном браузере
    if (insideTelegram()) {
      load('https://telegram.org/js/telegram-web-app.js',
        function () { loadPhaser(0); }, function () { loadPhaser(0); });
    } else {
      loadPhaser(0);
    }
  })();
</script>
</body>
</html>
