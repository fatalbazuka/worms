# Игра по пути https://домен/worms на уже работающем nginx сервера.
# Вставить эти два блока внутрь server { … } нужного домена; контейнер игры
# поднят как `docker compose up -d --build` и слушает 127.0.0.1:8080.

# Без слэша на конце относительные адреса страницы считались бы от корня
location = /worms { return 301 /worms/; }

location /worms/ {
    # Слэш в конце proxy_pass срезает /worms/: контейнер видит обычные /, /api/…
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
