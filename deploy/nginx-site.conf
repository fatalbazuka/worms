# Пример сайта для nginx на самом сервере (без Docker).
#
#   npm run build && rsync -a --delete dist/ user@server:/var/www/worms/
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/worms
#   sudo ln -s ../sites-available/worms /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d worms.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Если игра уже крутится в Docker на порту 8080 — вместо root/location
# ниже достаточно одного блока:
#   location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host;
#                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

server {
    listen 80;
    listen [::]:80;
    server_name worms.example.com;

    root /var/www/worms;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;

    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /env.js {
        add_header Cache-Control "no-store" always;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
    location /src/ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
