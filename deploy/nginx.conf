# Статика игры. Сборки нет: отдаём файлы как есть, с кэшем по типу.
server {
    # Только IPv4: внутри контейнера IPv6 часто выключен, а снаружи
    # оба протокола принимает Docker или обратный прокси
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Адрес клиента — от обратного прокси (Caddy, внешний nginx)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;

    # Встраивание разрешено только Telegram (Mini App в веб-клиенте).
    # X-Frame-Options не ставим: ALLOWALL не существует, а невалидное
    # значение часть браузеров читает как DENY.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Настройки развёртывания пишутся при старте контейнера — не кэшировать
    location = /env.js {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Код игры меняется с каждым деплоем, имена файлов без хэшей:
    # браузер переспрашивает и получает 304, если ничего не поменялось
    location /src/ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Phaser и supabase-js закреплены по версии и не меняются
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Служебные файлы наружу не отдаём
    location ~ /\. { deny all; }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
